<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" fill="#0D1117" rx="6"/>
  
  <!-- Terminal Window -->
  <rect x="10" y="14" width="44" height="36" fill="#161b22" stroke="#25e2f4" stroke-width="2" rx="3"/>
  
  <!-- Terminal Title Bar -->
  <rect x="10" y="14" width="44" height="10" fill="#30363d" rx="3"/>
  <circle cx="18" cy="19" r="2.5" fill="#ff5f57"/>
  <circle cx="26" cy="19" r="2.5" fill="#ffbd2e"/>
  <circle cx="34" cy="19" r="2.5" fill="#28ca42"/>
  
  <!-- Terminal Prompt -->
  <text x="14" y="36" font-family="monospace" font-size="10" fill="#25e2f4">&gt;</text>
  
  <!-- Terminal Cursor (Blinking) -->
  <rect x="24" y="30" width="4" height="12" fill="#25e2f4">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Code Lines -->
  <rect x="14" y="42" width="20" height="2" fill="#a855f7" opacity="0.7"/>
  <rect x="14" y="46" width="16" height="2" fill="#60a5fa" opacity="0.7"/>
</svg>

